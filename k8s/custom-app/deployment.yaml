apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-metrics-app
  namespace: monitoring
  labels:
    app: custom-metrics-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-metrics-app
  template:
    metadata:
      labels:
        app: custom-metrics-app
    spec:
      containers:
        - name: app
          image: custom-metrics-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: custom-metrics-app
  namespace: monitoring
  labels:
    app: custom-metrics-app
spec:
  selector:
    app: custom-metrics-app
  ports:
    - name: http
      port: 8080
      targetPort: http


